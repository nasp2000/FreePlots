# SPDX-License-Identifier: MIT
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      # A tag must describe the version the binary actually reports.
      - name: Release tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/check-release-version.py "$GITHUB_REF_NAME"
      - name: Tests
        run: cargo test --workspace --features desktop --locked

  windows:
    name: Windows x86_64 portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build portable exe
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p fp-app --features desktop
      # Unsigned Windows release for now: the release notes tell the user to
      # verify the SHA-256. A certificate or signing service can be added later
      # without changing the rest of the pipeline.
      - name: Sign and verify the executable
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) {
            Write-Host "::warning::WINDOWS_CERT_PFX is not set; this executable is unsigned and SmartScreen will warn on downloaded copies."
            exit 0
          }
          if (-not $env:CERT_PASSWORD) {
            throw "WINDOWS_CERT_PASSWORD is not set."
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /f $pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\FreePlots.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
          $signature = Get-AuthenticodeSignature target\release\FreePlots.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate
          if ($signature.Status -ne 'Valid') {
            throw "the Authenticode signature is not valid: $($signature.Status)"
          }
      - name: Check dependencies
        shell: pwsh
        run: |
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($dumpbin) {
            & $dumpbin.Source /dependents target\release\FreePlots.exe
          } else {
            Write-Host "dumpbin not on PATH; skipping dependency listing"
          }
      - name: GUI smoke test
        shell: pwsh
        run: ./scripts/windows-gui-smoke.ps1 -Exe target/release/FreePlots.exe
      - name: Licence inventory and SBOM for this build
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/licence-inventory.py \
            --platform x86_64-pc-windows-msvc \
            --artifact FreePlots-windows-x86_64 \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Bundle the release archive
        shell: pwsh
        run: |
          $name = "FreePlots-windows-x86_64"
          $staging = "bundle\$name"
          New-Item -ItemType Directory -Force -Path $staging, "dist" | Out-Null
          Copy-Item target/release/FreePlots.exe $staging
          Copy-Item LICENSE $staging
          Copy-Item licences-out/LICENSES.txt, licences-out/THIRD-PARTY.md, `
            licences-out/DEPENDENCIES.csv, licences-out/sbom.spdx.json $staging
          @(
            "FreePlots $env:GITHUB_REF_NAME",
            "",
            "This archive contains the executable, the project licence, the licence inventory, the third-party notices and the SPDX SBOM.",
            "",
            "The Windows executable is unsigned: SmartScreen may warn on a downloaded copy.",
            "Verify the archive against SHA256SUMS before extracting it."
          ) | Set-Content "$staging\README.txt"
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\$name.zip" -CompressionLevel Optimal
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: FreePlots-windows-x86_64
          path: dist/FreePlots-windows-x86_64.zip
          if-no-files-found: error

  linux:
    name: Raspberry Pi 4 (aarch64) portable
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev zip
      - name: Build portable binary
        run: cargo build --release --locked -p fp-app --features desktop
      - name: Strip the binary
        run: strip target/release/FreePlots
      - name: Smoke test
        run: ./target/release/FreePlots --version
      - name: Licence inventory and SBOM for this build
        run: |
          case "${{ matrix.arch }}" in
            x86_64) PLATFORM=x86_64-unknown-linux-gnu ;;
            aarch64) PLATFORM=aarch64-unknown-linux-gnu ;;
          esac
          python3 scripts/licence-inventory.py \
            --platform "$PLATFORM" \
            --artifact "FreePlots-rpi4-${{ matrix.arch }}" \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          name="FreePlots-rpi4-${{ matrix.arch }}"
          staging="bundle/$name"
          mkdir -p "$staging"
          cp target/release/FreePlots "$staging/"
          cp LICENSE "$staging/"
          cp licences-out/LICENSES.txt licences-out/THIRD-PARTY.md licences-out/DEPENDENCIES.csv licences-out/sbom.spdx.json "$staging/"
          {
            echo "FreePlots $GITHUB_REF_NAME"
            echo
            echo "This archive contains the executable, the project licence, the licence inventory, the third-party notices and the SPDX SBOM."
            echo
            echo "Verify the archive against SHA256SUMS before extracting it."
          } > "$staging/README.txt"
          (cd "$staging" && zip -q -r "../../dist/$name.zip" .)
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: FreePlots-rpi4-${{ matrix.arch }}
          path: dist/FreePlots-rpi4-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the archives
        run: |
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          ls -lh release
      - name: Checksums
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from the CHANGELOG
        run: python3 scripts/changelog-section.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: release-notes.md
