name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --features desktop --locked

  windows:
    name: Windows x86_64 portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p fp-app --features desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-windows-x86_64
          path: target/release/FreePlots.exe
          if-no-files-found: error

  linux-arm:
    name: Linux aarch64 portable
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Build
        run: cargo build --release --locked -p fp-app --features desktop
      - name: Strip and smoke test
        run: |
          strip target/release/FreePlots
          ./target/release/FreePlots --version
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-linux-aarch64
          path: target/release/FreePlots
          if-no-files-found: error
