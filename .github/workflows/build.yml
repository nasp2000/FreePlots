# SPDX-License-Identifier: MIT
name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Independent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features desktop -- -D warnings
      - name: Reference provenance
        run: python3 scripts/reference-report.py --check
      - name: Licence headers
        run: |
          python3 scripts/check-spdx.py --self-test
          python3 scripts/check-spdx.py
      - name: Document links
        run: |
          python3 scripts/check-links.py --self-test
          python3 scripts/check-links.py
      - name: Tests
        run: cargo test --workspace --features desktop --locked

  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Analyses on a million rows
        env:
          FREEPLOTS_ANALYSIS_BUDGET_MS: 5000
        run: cargo test --release --locked -p fp-core --test performance_budget
      - name: Heap with a million cells
        run: cargo test --release --locked -p fp-core --test memory_budget
      - name: Import a million cells
        run: cargo test --release --locked -p fp-core --lib import_one_million -- --ignored
      - name: Grid frame budget
        env:
          FREEPLOTS_FRAME_BUDGET_MS: 60
          FREEPLOTS_EDIT_BUDGET_MS: 40
        run: cargo test --release --locked -p fp-ui --lib grid_100k -- --ignored
      - name: Grid frame budget with a million rows
        env:
          FREEPLOTS_FRAME_BUDGET_MS: 60
          FREEPLOTS_EDIT_BUDGET_MS: 40
        run: cargo test --release --locked -p fp-ui --lib grid_million -- --ignored

  linux-gui:
    name: Linux GUI smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers \
            xvfb xdotool openbox python3-pil
      - name: Build
        run: cargo build --release --locked -p fp-app --features desktop
      # The window must paint on a hidden X display, under the default backend
      # and the wgpu override. A renderer that opens a blank client area fails.
      - name: GUI smoke test
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 scripts/linux-gui-smoke.py --exe target/release/FreePlots

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Fetch every locked crate
        run: cargo fetch --locked
      - name: Committed licence inventory is current
        run: python3 scripts/licence-inventory.py --check

  windows:
    name: Windows x86_64 portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace --features desktop --locked
      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p fp-app --features desktop
      # The window must paint on a real desktop with the runner's software
      # D3D12 adapter (WARP), under the default backend and the explicit
      # overrides. A renderer that opens a blank client area fails here.
      - name: GUI smoke test
        shell: pwsh
        run: ./scripts/windows-gui-smoke.ps1 -Exe target/release/FreePlots.exe
      - name: Licence inventory and SBOM for this build
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/licence-inventory.py \
            --platform x86_64-pc-windows-msvc \
            --artifact FreePlots-windows-x86_64 \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          cp target/release/FreePlots.exe dist/
          cp licences-out/LICENSES.txt licences-out/THIRD-PARTY.md licences-out/DEPENDENCIES.csv licences-out/sbom.spdx.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-windows-x86_64
          path: dist
          if-no-files-found: error

  linux-arm:
    name: Linux aarch64 portable
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Build
        run: cargo build --release --locked -p fp-app --features desktop
      - name: Strip and smoke test
        run: |
          strip target/release/FreePlots
          ./target/release/FreePlots --version
      - name: Licence inventory and SBOM for this build
        run: |
          python3 scripts/licence-inventory.py \
            --platform aarch64-unknown-linux-gnu \
            --artifact FreePlots-linux-aarch64 \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          cp target/release/FreePlots dist/
          cp licences-out/LICENSES.txt licences-out/THIRD-PARTY.md licences-out/DEPENDENCIES.csv licences-out/sbom.spdx.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-linux-aarch64
          path: dist
          if-no-files-found: error
