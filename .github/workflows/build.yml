name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Independent tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features desktop -- -D warnings
      - name: Tests
        run: cargo test --workspace --features desktop --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Fetch every locked crate
        run: cargo fetch --locked
      - name: Committed licence inventory is current
        run: python3 scripts/licence-inventory.py --check

  windows:
    name: Windows x86_64 portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p fp-app --features desktop
      - name: Licence inventory and SBOM for this build
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" scripts/licence-inventory.py \
            --platform x86_64-pc-windows-msvc \
            --artifact FreePlots-windows-x86_64 \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          cp target/release/FreePlots.exe dist/
          cp licences-out/LICENSES.txt licences-out/THIRD-PARTY.md licences-out/DEPENDENCIES.csv licences-out/sbom.spdx.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-windows-x86_64
          path: dist
          if-no-files-found: error

  linux-arm:
    name: Linux aarch64 portable
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev
      - name: Build
        run: cargo build --release --locked -p fp-app --features desktop
      - name: Strip and smoke test
        run: |
          strip target/release/FreePlots
          ./target/release/FreePlots --version
      - name: Licence inventory and SBOM for this build
        run: |
          python3 scripts/licence-inventory.py \
            --platform aarch64-unknown-linux-gnu \
            --artifact FreePlots-linux-aarch64 \
            --output-dir licences-out \
            --third-party licences-out/THIRD-PARTY.md \
            --notice licences-out/LICENSES.txt \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          cp target/release/FreePlots dist/
          cp licences-out/LICENSES.txt licences-out/THIRD-PARTY.md licences-out/DEPENDENCIES.csv licences-out/sbom.spdx.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: FreePlots-linux-aarch64
          path: dist
          if-no-files-found: error
