# SPDX-License-Identifier: MIT
[graph]
# The platforms the portable builds are made for. Crates that only other
# targets use stay out of the licence and advisory check.
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[licenses]
# Permissive licenses only. MIT is the project license; everything we link must
# be compatible with distributing a closed or open binary.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "IJG", "ISC", "Unlicense", "Zlib", "Unicode-3.0", "OFL-1.1", "Ubuntu-font-1.0"]
confidence-threshold = 0.9

[advisories]
version = 2
yanked = "deny"
# The unmaintained crates are transitive dependencies of the pinned egui
# release (font shaping and accessibility); check our own crates strictly.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # GPL/AGPL would contaminate an MIT binary distributed as a single artefact.
  { name = "gpl" },
  { name = "agpl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
