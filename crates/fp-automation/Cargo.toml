# SPDX-License-Identifier: MIT
[package]
name = "fp-automation"
description = "FreePlots: semantic automation of the real egui interface for tests and tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Headless screenshots need a GPU (wgpu) and the PNG encoder. The shipped
# binary leaves them out: the MCP screenshots the live window instead.
wgpu-render = ["egui_kittest/wgpu", "dep:image"]

[dependencies]
fp-core.workspace = true
fp-ui.workspace = true
egui.workspace = true
egui_kittest.workspace = true
image = { version = "=0.25.6", default-features = false, features = ["png"], optional = true }
serde.workspace = true
serde_json.workspace = true
